# 清爽淡藍卡片主題
# 顏色取自 dataviz 設計規範的淺色 ink/surface,並以對比驗證器實測過:
#   primary ink #0b0b0b 對白卡片 19.68:1、secondary #52514e 7.94:1、muted #6f6e6a 5.10:1
[theme]
base = "light"
primaryColor = "#c04c1b"             # 溫度色階中段(單一橘色系)
backgroundColor = "#f7fafd"          # 頁面底
secondaryBackgroundColor = "#ffffff" # 卡片 / 側邊欄表面
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
# 有些機器的 inotify watch 數量有上限,改用輪詢才不會啟動時噴 ENOSPC
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
